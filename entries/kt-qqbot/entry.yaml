name: kt-qqbot
repo: https://github.com/Kohaku-Lab/kt-qqbot
description: Put a creature into QQ private and group chats. QR bot login, a qq_feed trigger and qq_send tool so it decides when to speak, stickers, image search, persona image, dashboard UI.
tags: [creatures, plugins, tools, qq, chat-bot, ui-extension]
author: KohakuBlueleaf
license: Apache-2.0
framework: ">2.1.8,<3.0.0"
versions:
  - tag: v0.1.3
    released: "2026-10-29"
    notes: "Prompt: the creature never replies to, quotes or replays backfill history; it responds only to new chat."
  - tag: v0.1.2
    released: "2026-10-29"
    notes: "Lower latency: inbound images download in parallel with a 5 s per-image timeout (text is never held back), and lower default wake delays (quiet 6 s, cooldown 15 s, every 5 messages, batch 0.5 s)."
  - tag: v0.1.1
    released: "2026-10-29"
    notes: "Fix image search (now uses ddgs; it returned nothing before), fold chat that arrives while the creature is busy into its running turn, prompt tells it to retry searches."
  - tag: v0.1.0
    released: "2026-10-28"
    notes: "First release: QR / manual login, gateway hub with resume, qq_feed trigger, qq_send / qq_history / qq_sticker / qq_image_search tools, character and persona image, router for one creature per chat, guard plugins, dashboard UI."
