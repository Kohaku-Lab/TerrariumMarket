name: kt-claude-code
repo: https://github.com/Kohaku-Lab/kt-claude-code
description: LLM backend that runs model steps through your own signed-in Claude Code (Claude Agent SDK). Personal use; it provides no login of its own.
tags: [plugins, llm-backend, claude-code]
author: KohakuBlueleaf
license: Apache-2.0
framework: ">=2.2.0,<3.0.0"
